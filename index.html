<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; color: #333; }
        .form-container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; margin-top: 15px; }
        .row > div { flex: 1; }
        .btn-add { color: #007bff; cursor: pointer; font-weight: bold; margin-top: 15px; display: inline-block; font-size: 14px; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-group">
        <label>Select Service Type</label>
        <select id="serviceType" onchange="renderForm()">
            <option value="transfer">TRANSFER</option>
            <option value="per-hour">PER HOUR</option>
            <option value="from-airport">FROM AIRPORT</option>
            <option value="to-airport">TO AIRPORT</option>
        </select>
    </div>
    <div id="fieldsContainer"></div>
</div>

<script>
const fields = {
    transfer: `
        <label>Pickup Location</label><input type="text" placeholder="Pick up">
        <label style="margin-top:10px">Dropoff Location</label><input type="text" placeholder="Drop off">
        <div class="row">
            <div><label>Date</label><input type="date"></div>
            <div><label>Time</label><input type="time"></div>
        </div>
        <div class="row">
            <div><label>Adults</label><input type="number" value="1" min="1"></div>
            <div><label>Children</label><input type="number" value="0" min="0"></div>
        </div>
        `,
    
    'per-hour': `
        <label>Pickup Location</label><input type="text" placeholder="Pick up">
        <div class="row">
            <div><label>Date</label><input type="date"></div>
            <div><label>Time</label><input type="time"></div>
        </div>
        <label style="margin-top:15px">Duration (Hours)</label><input type="number" placeholder="e.g. 3">`,
        
    'from-airport': `
        <label>Flight Number</label><input type="text" placeholder="e.g. AA123">
        <label style="margin-top:10px">Airport / Pickup</label><input type="text">
        <label style="margin-top:10px">Dropoff Location</label><input type="text">
        <div class="row">
            <div><label>Date</label><input type="date"></div>
            <div><label>Time</label><input type="time"></div>
        </div>
        <div class="row">
            <div><label>Adults</label><input type="number" value="1" min="1"></div>
            <div><label>Children</label><input type="number" value="0" min="0"></div>
        </div>
        <label style="margin-top:15px">Luggage Count</label><input type="number" value="0" min="0">
        `,

    'to-airport': `
        <label>Pickup Location</label><input type="text">
        <label style="margin-top:10px">Airport / Dropoff</label><input type="text">
        <div class="row">
            <div><label>Date</label><input type="date"></div>
            <div><label>Time</label><input type="time"></div>
        </div>
        <div class="row">
            <div><label>Adults</label><input type="number" value="1" min="1"></div>
            <div><label>Children</label><input type="number" value="0" min="0"></div>
        </div>
        <label style="margin-top:15px">Luggage Count</label><input type="number" value="0" min="0">


<h3>Research Sources</h3>
<ul>
    <li><a href="https://www.chauffeureverywhere.com/" target="_blank">Chauffeur Everywhere</a></li>
    <li><a href="https://daytrip.com/" target="_blank">Daytrip</a></li>
    <li><a href="https://www.airportexecutive.com/" target="_blank">Airport Executive</a></li>
    <li><a href="https://www.transfeero.com/en/" target="_blank">Transfeero</a></li>
    <li><a href="https://limotak.com/" target="_blank">Limotak</a></li>
    <li><a href="https://accounts.drivania.com/sign-up" target="_blank">Drivania</a></li>
</ul>
      `
};

function renderForm() {
    const type = document.getElementById('serviceType').value;
    document.getElementById('fieldsContainer').innerHTML = fields[type];
}

// Initialize on page load
renderForm();
</script>

</body>
</html>
